[workspace]
members = [
    "crates/ingestion",
    "crates/storage",
    "crates/rest-service",
    "crates/retracer-core",
    "crates/retracerd",
    "examples/spoke-indexer",
]
resolver = "2"
default-members = ["crates/retracerd"]

[workspace.dependencies]
ingestion = { path = "crates/ingestion" }
storage = { path = "crates/storage" }
rest-service = { path = "crates/rest-service" }
retracer-core = { path = "crates/retracer-core" }

anyhow = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
dotenvy = "0.15"
# Constant-time bearer-token comparison — same crate/pattern Arxium's own
# core/rpc already uses for its `Authorization: Bearer` guard.
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# OpenAPI: the spec is derived from the handlers and response types, so it
# can't drift from the code the way a hand-written YAML would.
utoipa = { version = "5", features = ["axum_extras"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }

