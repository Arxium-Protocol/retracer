# Default Tier A address-extraction schema for Arxium's own CoreChain
# circuits (see Retracer_AddressExtraction_Plan.md §2). Field/kind names
# are taken directly from `arxd/runtime/src/lib.rs::ActionPayload`.
#
# A builder running their own chain ships their own copy of this file
# alongside the `retracerd` binary (--kind-schema) — no code, no fork.

[[kind]]
name = "Transfer"

  [[kind.roles]]
  path = "$.to"
  role = "to"

[[kind]]
name = "Stake"

  [[kind.roles]]
  path = "$.validator"
  role = "validator_subject"

[[kind]]
name = "Unstake"

  [[kind.roles]]
  path = "$.validator"
  role = "validator_subject"

# JoinValidator / LeaveValidator have no address-bearing payload fields —
# the sender (already indexed via actions.from_address) is the only party.

[[kind]]
name = "TransferAsset"

  # V6 reset: the asset is named by its derived `AssetRef` (`arxasset1…`), not
  # a slug, so "every action touching this asset" is a payload-field query.
  # Indexed as text — it is an identifier, not an address, so it is not a
  # role (roles go through the address validator, which only accepts `arx1`).
  [[kind.index]]
  path = "$.asset"
  type = "text"

  [[kind.roles]]
  path = "$.to"
  role = "to"

[[kind]]
name = "GrantAttestation"

  [[kind.roles]]
  path = "$.subject"
  role = "other:subject"

[[kind]]
name = "RevokeAttestation"

  [[kind.roles]]
  path = "$.subject"
  role = "other:subject"

# There is no admin role: attestors join by `ApplyAttestor` (sent by the
# attestor's own multisig, so the sender is the party) plus a validator vote,
# and leave by a removal vote. `RegisterAttestor`/`DeregisterAttestor` no
# longer exist on the chain.
[[kind]]
name = "ApplyAttestor"

  # The real-world name validators verify before voting.
  [[kind.index]]
  path = "$.name"
  type = "text"

# BlockAttestor (an attestor's emergency self-block) has no payload fields:
# the sender is the attestor.

# Governance proposals name the attestor they add, remove or unblock. The
# action is externally tagged, like `Token`. Other proposal kinds carry no
# address Retracer indexes.
[[kind]]
name = "SubmitProposal"

  [[kind.roles]]
  path = "$.action.AddAttestor.attestor"
  role = "other:attestor"

  [[kind.roles]]
  path = "$.action.RemoveAttestor.attestor"
  role = "other:attestor"

  [[kind.roles]]
  path = "$.action.UnblockAttestor.attestor"
  role = "other:attestor"

[[kind]]
name = "SetHolderFrozen"

  [[kind.index]]
  path = "$.asset"
  type = "text"

  [[kind.roles]]
  path = "$.holder"
  role = "other:holder"

[[kind]]
name = "LockHolderAmount"

  [[kind.index]]
  path = "$.asset"
  type = "text"

  [[kind.roles]]
  path = "$.holder"
  role = "other:holder"

[[kind]]
name = "UnlockHolderAmount"

  [[kind.index]]
  path = "$.asset"
  type = "text"

  [[kind.roles]]
  path = "$.holder"
  role = "other:holder"

[[kind]]
name = "IssuerForcedTransfer"

  [[kind.index]]
  path = "$.asset"
  type = "text"

  # Neither party signed the action — the issuer did — so both are only
  # discoverable through the payload. `from` is the holder whose balance was
  # taken, which makes it the address most likely to be searched for after
  # one of these lands.
  [[kind.roles]]
  path = "$.from"
  role = "from"

  [[kind.roles]]
  path = "$.to"
  role = "to"

[[kind]]
name = "RecoverHolder"

  [[kind.index]]
  path = "$.asset"
  type = "text"

  # The lost wallet is the one someone will search for; the replacement is
  # where its balance went.
  [[kind.roles]]
  path = "$.lost"
  role = "from"

  [[kind.roles]]
  path = "$.replacement"
  role = "to"

[[kind]]
name = "IssueAssetTo"

  [[kind.index]]
  path = "$.asset"
  type = "text"

  [[kind.roles]]
  path = "$.to"
  role = "to"

# Token circuit: one kind, `Token`, with the variant nested one level down
# (`{"Transfer":{"token","to","amount"}}`). Only Mint and Transfer name a
# party besides the sender; Create / Burn / RenounceMint don't. A path that
# doesn't match this action's variant resolves to nothing and is skipped.
[[kind]]
name = "Token"

  [[kind.roles]]
  path = "$.Mint.to"
  role = "to"

  [[kind.roles]]
  path = "$.Transfer.to"
  role = "to"

# RegisterAsset / IssueAsset / BurnAsset / SubmitExecutionFault / FreezeAsset /
# UnfreezeAsset have no address-bearing payload fields — the sender (already
# indexed via actions.from_address) is the only party. The ones that name an
# asset still get the `$.asset` projection so an asset's whole history is one
# indexed query. RegisterAsset carries the slug (`asset_id`), not the ref.

[[kind]]
name = "IssueAsset"
  [[kind.index]]
  path = "$.asset"
  type = "text"

[[kind]]
name = "BurnAsset"
  [[kind.index]]
  path = "$.asset"
  type = "text"

[[kind]]
name = "FreezeAsset"
  [[kind.index]]
  path = "$.asset"
  type = "text"

[[kind]]
name = "UnfreezeAsset"
  [[kind.index]]
  path = "$.asset"
  type = "text"

[[kind]]
name = "RegisterAsset"
  [[kind.index]]
  path = "$.asset_id"
  type = "text"
  [[kind.index]]
  path = "$.metadata.symbol"
  type = "text"
