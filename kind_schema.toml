# Default Tier A address-extraction schema for Arxium's own CoreChain
# circuits (see Retracer_AddressExtraction_Plan.md §2). Field/kind names
# are taken directly from `arxd/runtime/src/lib.rs::ActionPayload`.
#
# A builder running their own chain ships their own copy of this file
# alongside the `retracerd` binary (--kind-schema) — no code, no fork.

[[kind]]
name = "Transfer"

  [[kind.roles]]
  path = "$.to"
  role = "to"

[[kind]]
name = "Stake"

  [[kind.roles]]
  path = "$.validator"
  role = "validator_subject"

[[kind]]
name = "Unstake"

  [[kind.roles]]
  path = "$.validator"
  role = "validator_subject"

# JoinValidator / LeaveValidator have no address-bearing payload fields —
# the sender (already indexed via actions.from_address) is the only party.

[[kind]]
name = "TransferAsset"

  [[kind.roles]]
  path = "$.to"
  role = "to"

[[kind]]
name = "GrantAttestation"

  [[kind.roles]]
  path = "$.subject"
  role = "other:subject"

[[kind]]
name = "RevokeAttestation"

  [[kind.roles]]
  path = "$.subject"
  role = "other:subject"

[[kind]]
name = "RegisterAttestor"

  [[kind.roles]]
  path = "$.attestor"
  role = "other:attestor"

[[kind]]
name = "DeregisterAttestor"

  [[kind.roles]]
  path = "$.attestor"
  role = "other:attestor"

# RegisterAsset / IssueAsset / SubmitExecutionFault have no address-bearing
# payload fields — the sender (already indexed via actions.from_address) is
# the only party.
