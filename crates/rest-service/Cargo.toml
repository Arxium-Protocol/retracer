[package]
name = "rest-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
storage = { workspace = true }
ingestion = { workspace = true }
sqlx = { workspace = true }
axum = "0.8"
# Calls the node's own public `GET /validators?height=N` for uptime — same
# category of call ArxPlusApi's NodeProxy already makes, not a privileged one.
reqwest = { workspace = true }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
utoipa = { workspace = true }
# `/docs` is one HTML page that loads Redoc from a CDN — no bundled UI assets.
utoipa-redoc = { version = "6", features = ["axum"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
tower = { version = "0.5", features = ["util"] }
