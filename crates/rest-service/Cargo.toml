[package]
name = "rest-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
storage = { workspace = true }
ingestion = { workspace = true }
sqlx = { workspace = true }
# Already in the tree via tonic, so this costs no extra build.
axum = "0.8"
# Calls the node's own public `GET /validators?height=N` for uptime — same
# category of call ArxPlusApi's NodeProxy already makes, not a privileged one.
reqwest = { workspace = true }
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
