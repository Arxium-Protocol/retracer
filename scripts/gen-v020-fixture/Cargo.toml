[workspace]

[package]
name = "gen-v020-fixture"
version = "0.0.0"
edition = "2021"
publish = false

# Not a Retracer workspace member (kept out of crates/*'s member list on
# purpose) — this is a dev tool, run by hand against a sibling Arxium
# checkout, not something CI or the shipped binary ever builds. See
# crates/ingestion/src/lib.rs::decodes_arxium_v020_block_fixture for what
# its output feeds.
[dependencies]
arxd-runtime = { path = "../../../Arxium/arxd/runtime" }
xc-primitives = { path = "../../../Arxium/core/primitives" }
bincode = { version = "2", features = ["serde"] }
