name: Version CI and Release

# An exact semantic version tag is the deployment trigger for Retracer on
# VPS A. The tag must sit on the current remote main tip: a side-branch tag,
# a stale tag, or a malformed tag fails in validate-tag before anything is
# built, released, or dispatched. After the release is published this workflow
# dispatches retracer-version-release-v1 to the private Arxium-Ops repository,
# which owns every host-side action. Nothing here touches a VPS.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: retracer-version-release
  cancel-in-progress: false

env:
  SQLX_OFFLINE: 'true'
  SOURCE_REPOSITORY: Arxium-Protocol/retracer

jobs:
  validate-tag:
    name: Validate the deployment tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require an exact version tag at the current main tip
        id: tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || {
            printf 'error: this workflow runs only for tags\n' >&2
            exit 1
          }
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'error: %s is not an exact vX.Y.Z version tag\n' "$version" >&2
            exit 1
          }

          # The tag must name the current remote main tip. A tag on a side
          # branch, or one left behind by later merges, would otherwise deploy
          # code that main no longer contains.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          tagged="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [[ "$tagged" == "$main_tip" ]] || {
            printf 'error: tag %s points at %s but main is at %s\n' \
              "$version" "$tagged" "$main_tip" >&2
            printf 'A deployment tag must be created at the current main tip.\n' >&2
            exit 1
          }

          prior="$(git tag --merged "${tagged}^" --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [[ -n "$prior" ]]; then
            IFS=. read -r major minor patch <<< "${version#v}"
            IFS=. read -r prior_major prior_minor prior_patch <<< "${prior#v}"
            ((10#$major > 10#$prior_major ||
              (10#$major == 10#$prior_major && 10#$minor > 10#$prior_minor) ||
              (10#$major == 10#$prior_major && 10#$minor == 10#$prior_minor &&
               10#$patch > 10#$prior_patch))) || {
              printf 'error: tag %s must be numerically greater than prior release %s\n' \
                "$version" "$prior" >&2
              exit 1
            }
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'source_sha=%s\n' "$tagged"
          } >> "$GITHUB_OUTPUT"

          {
            printf '## Deployment tag accepted\n\n'
            printf 'Version: %s\n\n' "$version"
            printf 'Commit: %s (current main tip)\n' "$tagged"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test the workspace
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retracer
          POSTGRES_PASSWORD: retracer
          POSTGRES_DB: retracer
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://retracer:retracer@localhost:5433/retracer
      # Without this, storage/tests/postgres.rs's `skip_without_db!` macro
      # treats the Postgres integration tests as opt-in and silently no-ops
      # them — `DATABASE_URL` above is only for `cargo sqlx prepare`.
      RETRACER_TEST_DATABASE_URL: postgres://retracer:retracer@localhost:5433/retracer

    steps:
      - name: Check out Retracer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Show the Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version

      - name: Validate the installer
        shell: bash
        run: bash -n scripts/install.sh

      - name: Test the workspace
        shell: bash
        run: cargo test --workspace --locked

      - name: Clippy with warnings denied
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The `.sqlx/` cache lets offline builds type-check queries without a
      # database, but a stale entry for a removed query lingers silently.
      # This fails the PR when the cache drifts from the queries or schema.
      - name: Verify the sqlx query cache is fresh
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
          sqlx database setup
          cargo sqlx prepare --check --workspace

  release:
    name: Build and publish release
    needs:
      - validate-tag
      - test
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.checksums.outputs.archive_sha256 }}
      binary_sha256: ${{ steps.checksums.outputs.binary_sha256 }}
      schema_sha256: ${{ steps.checksums.outputs.schema_sha256 }}

    steps:
      - name: Check out Retracer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Build retracerd (release)
        shell: bash
        env:
          RETRACER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --locked -p retracerd

      - name: Package binary
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          out="retracerd-${tag}-x86_64-linux-gnu"
          mkdir -p "dist/${out}"
          cp target/release/retracerd "dist/${out}/"
          cp kind_schema.toml "dist/${out}/"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          rm -rf "dist/${out}"
          cp proto/retracer.proto "dist/retracer-${tag}.proto"

      # scripts/install.sh verifies the release archive against this file.
      # The binary and schema checksums are exported as well so Arxium-Ops can
      # prove exactly which executable and which kind schema it installed,
      # not merely which archive it downloaded.
      - name: Generate checksums
        id: checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          binary_sha256="$(sha256sum target/release/retracerd | awk '{print $1}')"
          schema_sha256="$(sha256sum kind_schema.toml | awk '{print $1}')"
          cd dist
          sha256sum *.tar.gz *.proto > SHA256SUMS
          grep -Eq "^[0-9a-f]{64}  retracerd-${GITHUB_REF_NAME}-x86_64-linux-gnu[.]tar[.]gz$" SHA256SUMS
          cat SHA256SUMS
          archive_sha256="$(awk -v f="retracerd-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" \
            '$2 == f {print $1}' SHA256SUMS)"
          for value in "$binary_sha256" "$schema_sha256" "$archive_sha256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || {
              printf 'error: a release checksum is missing or malformed\n' >&2
              exit 1
            }
          done
          {
            printf 'archive_sha256=%s\n' "$archive_sha256"
            printf 'binary_sha256=%s\n' "$binary_sha256"
            printf 'schema_sha256=%s\n' "$schema_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.proto dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  dispatch-deployment:
    name: Dispatch the release to Arxium-Ops
    needs:
      - validate-tag
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Arxium-Ops owns every host-side action. This job only states, in one
      # checksum-pinned document, what was released. It has no VPS access.
      - name: Dispatch retracer-version-release-v1
        shell: bash
        env:
          ARXIUM_OPS_DISPATCH_TOKEN: ${{ secrets.ARXIUM_OPS_DISPATCH_TOKEN }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          ARCHIVE_SHA256: ${{ needs.release.outputs.archive_sha256 }}
          BINARY_SHA256: ${{ needs.release.outputs.binary_sha256 }}
          SCHEMA_SHA256: ${{ needs.release.outputs.schema_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ -n "$ARXIUM_OPS_DISPATCH_TOKEN" ]] || {
            printf 'error: ARXIUM_OPS_DISPATCH_TOKEN is not configured; ' >&2
            printf 'create the dispatch-only credential before tagging\n' >&2
            exit 1
          }
          # Quoted heredoc: no shell reader ever sees a $ inside single quotes,
          # and nothing materializes from data.
          python3 - "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID" \
            "$ARCHIVE_SHA256" "$BINARY_SHA256" "$SCHEMA_SHA256" \
            "$SOURCE_REPOSITORY" \
            <<'PYEOF' > dispatch.json
          import json, re, sys

          args = sys.argv[1:]
          if len(args) != 7:
              raise SystemExit("want 7 arguments, got %d" % len(args))
          (version, source_sha, run_id, archive_sha256, binary_sha256,
           schema_sha256, source_repository) = args
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("version is not an exact vX.Y.Z tag")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_sha is not a 40-character hex commit")
          for name, value in (("archive_sha256", archive_sha256),
                              ("binary_sha256", binary_sha256),
                              ("schema_sha256", schema_sha256)):
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(name + " is not a 64-character hex digest")
          print(json.dumps({
              "event_type": "retracer-version-release-v1",
              "client_payload": {
                  "version": version,
                  "source_repository": source_repository,
                  "source_sha": source_sha,
                  "source_run_id": int(run_id),
                  "archive_sha256": archive_sha256,
                  "binary_sha256": binary_sha256,
                  "schema_sha256": schema_sha256,
              },
          }))
          PYEOF

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $ARXIUM_OPS_DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/Arxium-Protocol/Arxium-Ops/dispatches \
            --data @dispatch.json

          {
            printf '## Deployment dispatched\n\n'
            printf 'Version: %s\n\n' "$VERSION"
            printf 'Commit: %s\n\n' "$SOURCE_SHA"
            printf 'Archive sha256: %s\n\n' "$ARCHIVE_SHA256"
            printf 'Binary sha256: %s\n\n' "$BINARY_SHA256"
            printf 'Schema sha256: %s\n' "$SCHEMA_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
