name: Version CI and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  SQLX_OFFLINE: 'true'

jobs:
  test:
    name: Test the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retracer
          POSTGRES_PASSWORD: retracer
          POSTGRES_DB: retracer
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://retracer:retracer@localhost:5433/retracer

    steps:
      - name: Check out Retracer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install protoc
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Show the Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version

      - name: Validate the installer
        shell: bash
        run: bash -n scripts/install.sh

      - name: Test the workspace
        shell: bash
        run: cargo test --workspace --locked

      - name: Clippy with warnings denied
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The `.sqlx/` cache lets offline builds type-check queries without a
      # database, but a stale entry for a removed query lingers silently.
      # This fails the PR when the cache drifts from the queries or schema.
      - name: Verify the sqlx query cache is fresh
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
          sqlx database setup
          cargo sqlx prepare --check --workspace

  release:
    name: Build and publish release
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Retracer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install protoc
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Build retracerd (release)
        shell: bash
        run: cargo build --release --locked -p retracerd

      - name: Package binary
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          out="retracerd-${tag}-x86_64-linux-gnu"
          mkdir -p "dist/${out}"
          cp target/release/retracerd "dist/${out}/"
          cp kind_schema.toml "dist/${out}/"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          rm -rf "dist/${out}"

      # scripts/install.sh verifies the release archive against this file.
      - name: Generate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          grep -Eq "^[0-9a-f]{64}  retracerd-${GITHUB_REF_NAME}-x86_64-linux-gnu[.]tar[.]gz$" SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
